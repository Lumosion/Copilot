<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="多内容记录站 - 记录电脑、电视剧、番剧、音乐和游戏">
    <meta name="keywords" content="内容记录,电脑,电视剧,番剧,音乐,游戏,IMDb">
    <title>多内容记录站</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <div>
                <h1 class="site-title">📚 多内容记录站</h1>
                <p class="site-subtitle">记录你的电脑、电视剧、番剧、音乐、游戏</p>
            </div>
            <nav aria-label="主导航">
                <ul class="nav-list">
                    <li><button class="nav-btn active" data-view="listView">列表</button></li>
                    <li><button class="nav-btn" data-view="editorView">新增</button></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container app-main" id="appMain">
        <section class="panel controls-panel" aria-label="搜索筛选">
            <div class="controls-grid">
                <div class="control-item category-control">
                    <span>分类</span>
                    <div id="categoryTabs" class="category-tabs" role="tablist" aria-label="分类标签">
                        <button class="category-tab active" type="button" role="tab" aria-selected="true" data-category="all">全部</button>
                        <button class="category-tab" type="button" role="tab" aria-selected="false" data-category="computer">电脑</button>
                        <button class="category-tab" type="button" role="tab" aria-selected="false" data-category="tv">电视剧</button>
                        <button class="category-tab" type="button" role="tab" aria-selected="false" data-category="anime">番剧</button>
                        <button class="category-tab" type="button" role="tab" aria-selected="false" data-category="music">音乐</button>
                        <button class="category-tab" type="button" role="tab" aria-selected="false" data-category="game">游戏</button>
                    </div>
                </div>
                <label class="control-item">
                    <span>关键词</span>
                    <input id="searchInput" type="search" placeholder="按标题、标签、备注搜索">
                </label>
                <label class="control-item">
                    <span>排序</span>
                    <select id="sortBy">
                        <option value="updatedAt">最近更新</option>
                        <option value="title">标题 A-Z</option>
                        <option value="rating">评分高到低</option>
                    </select>
                </label>
            </div>
        </section>

        <section id="listView" class="view panel" aria-labelledby="listHeading">
            <div class="view-head">
                <h2 id="listHeading">内容列表</h2>
                <div class="action-row">
                    <button id="createBtn" class="btn primary">新增内容</button>
                    <button id="importBtn" class="btn">导入</button>
                    <button id="exportBtn" class="btn">导出</button>
                    <button id="clearAllBtn" class="btn danger">删除全部</button>
                </div>
            </div>
            <input id="importFileInput" type="file" accept="application/json" class="hidden">
            <p id="listStatus" class="status" role="status" aria-live="polite"></p>
            <div id="cardGrid" class="card-grid"></div>
        </section>

        <section id="detailView" class="view panel hidden" aria-labelledby="detailHeading">
            <div class="view-head">
                <h2 id="detailHeading">详情</h2>
                <div class="action-row">
                    <button id="editBtn" class="btn">编辑</button>
                    <button id="deleteBtn" class="btn danger">删除</button>
                    <button class="btn ghost" data-view="listView">返回列表</button>
                </div>
            </div>
            <div id="detailContent" class="detail-content"></div>
        </section>

        <section id="editorView" class="view panel hidden" aria-labelledby="editorHeading">
            <div class="view-head">
                <h2 id="editorHeading">新增 / 编辑内容</h2>
                <button class="btn ghost" data-view="listView">返回列表</button>
            </div>

            <form id="entryForm" class="entry-form" novalidate>
                <input type="hidden" id="entryId">
                <div class="form-grid">
                    <label>
                        <span>分类 *</span>
                        <select id="entryCategory" required>
                            <option value="">请选择</option>
                            <option value="computer">电脑</option>
                            <option value="tv">电视剧</option>
                            <option value="anime">番剧</option>
                            <option value="music">音乐</option>
                            <option value="game">游戏</option>
                        </select>
                    </label>
                    <label>
                        <span>标题 *</span>
                        <input id="entryTitle" type="text" maxlength="80" required>
                    </label>
                    <label>
                        <span>评分（1-10）</span>
                        <input id="entryRating" type="number" min="1" max="10" step="0.1" placeholder="例如 8.5">
                    </label>
                    <label>
                        <span>年份</span>
                        <input id="entryYear" type="number" min="1900" max="2100" placeholder="例如 2024">
                    </label>
                    <label>
                        <span>平台 / 品牌</span>
                        <input id="entryPlatform" type="text" maxlength="60" placeholder="例如 Steam、Netflix、Apple">
                    </label>
                    <label>
                        <span>标签（逗号分隔）</span>
                        <input id="entryTags" type="text" maxlength="120" placeholder="例如 剧情,科幻,经典">
                    </label>
                </div>

                <label>
                    <span>简介 / 备注</span>
                    <textarea id="entryDescription" maxlength="800" rows="4" placeholder="写点想记录的内容..."></textarea>
                </label>

                <section id="imdbSection" class="imdb-section hidden" aria-labelledby="imdbHeading">
                    <h3 id="imdbHeading">TMDB / IMDb 自动匹配（电视剧/番剧）</h3>
                    <div class="imdb-search-row">
                        <input id="imdbTitle" type="text" placeholder="输入片名自动匹配">
                        <input id="imdbYear" type="number" min="1900" max="2100" placeholder="年份（可选）">
                        <button id="imdbSearchBtn" type="button" class="btn">自动匹配</button>
                    </div>
                    <p id="imdbStatus" class="status" role="status" aria-live="polite"></p>
                    <ul id="imdbResults" class="imdb-results"></ul>
                </section>

                <div class="form-actions">
                    <button type="submit" class="btn primary">保存</button>
                    <button id="resetBtn" type="reset" class="btn ghost">重置</button>
                </div>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>© <span id="year"></span> 多内容记录站 · 前端 MVP（本地数据 + TMDB/IMDb 匹配 + 导入导出）</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
